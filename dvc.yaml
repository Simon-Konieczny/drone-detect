# dvc.yaml
stages:
  prepare:
    cmd: python src/prepare.py
    deps: [src/prepare.py, data/raw]
    params: [prepare]
    outs: [data/processed, reports/samples]
    metrics:
      - reports/data_stats.json:
          cache: false

  train:
    cmd: python src/train.py
    deps: [src/train.py, src/engine.py, src/dataset.py, src/transforms.py, data/processed]
    params: [train, augment, prepare.classes]
    outs: [models/model.pt]
    metrics:
      - reports/train_metrics.json:
          cache: false

  evaluate:
    cmd: python src/evaluate.py
    deps: [src/evaluate.py, src/model.py, src/dataset.py, src/transforms.py, models/model.pt, data/processed]
    params: [evaluate, train.mlflow_uri, train.experiment]
    metrics:
      - reports/eval_metrics.json:
          cache: false
    plots:
      - reports/pr_curves.png:
          cache: false
  
  export:
    cmd: python src/export.py
    deps: [src/export.py, src/model.py, src/dataset.py, models/model.pt, data/processed, reports/eval_metrics.json]
    params: [export, evaluate.target_precision]
    outs: [models/model.onnx]
    metrics:
      - reports/export_metrics.json:
          cache: false